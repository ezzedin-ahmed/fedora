# gtklock: glib key file, read from $XDG_CONFIG_HOME/gtklock/config.ini.
# Every key here is also a command-line flag (--name=value); see gtklock(1).
#
# Values cannot use ~ or $HOME -- a glib key file does no expansion -- so any
# path here would have to be absolute, username and all. `style` is therefore
# NOT set here; wm/sway/config passes -s on the command line instead, where
# sh(1) expands $HOME. Run gtklock without that flag and it comes up unstyled.

[main]

# Dark GTK theme so the entry, selection and cursor colours are sane before
# style.css touches anything.
gtk-theme=Adwaita-dark

# date(1) formats. %e is space-padded so the date does not read "August  3".
time-format=%H:%M
date-format=%A, %e %B

# Deliberately NOT set: idle-hide / start-hidden. Both hide the password form
# until you move the mouse, which is the opposite of wanting an obvious place
# to type. The field stays on screen the whole time.
