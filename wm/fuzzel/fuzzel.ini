# Gruvbox dark, matched to waybar/style.css and alacritty/colors.toml.

[main]
font=Noto Sans:size=12
terminal=alacritty
prompt=❯ 
icons-enabled=yes
lines=10
width=40
horizontal-pad=18
vertical-pad=14
inner-pad=6
line-height=22

[colors]
# Slightly translucent, like the bar.
background=282828f2
text=ebdbb2ff
input=ebdbb2ff
prompt=83a598ff
placeholder=928374ff
# Matched characters of the search string.
match=fabd2fff
selection=504945ff
selection-text=fbf1c7ff
selection-match=fabd2fff
counter=928374ff
border=504945ff

[border]
width=1
radius=10
