<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Every font choice in this repo is made here. Four things are load-bearing,
  all of them found by testing rather than by reading docs, so read before
  editing and re-run the matrix in the comment at the bottom afterwards.

  1. The idiom is <match> + prepend_first, NOT <alias><prefer>. Fedora's conf.d
     snippets (57-google-noto-sans.conf and friends) have already put Noto onto
     the generics by the time this user config loads, and <prefer> appends
     *behind* those. It parses, it applies, and it changes nothing at all.

  2. Do NOT add binding="strong". It makes the first family win even for text
     it has no glyphs for, which destroys the Latin/Arabic split in point 4.

  3. Every rule names its own faces. Do not be tempted to chain them, pointing
     one family at another to avoid repeating the lists. That was tried, in
     both directions, and both silently misroute Arabic: prepend_first inserts
     at the absolute front, so whichever rule fires last wins, and Fedora
     aliases the generics into each other's family lists in ways that make a
     later rule hijack an earlier one. Repetition here is the price of each
     rule being independently correct.

  4. Latin, Arabic and emoji come from three different files in every list
     below: Inter and Hack have no Arabic glyphs at all, and nothing here but
     Noto Color Emoji covers emoji. The second and third families are not
     fallbacks for when the first is missing. Fontconfig matches per character
     and per language, so one mixed line takes Latin from the first family,
     Arabic from the second and emoji from the third, all in the same run.

     Noto Color Emoji is listed explicitly rather than left to its packaged
     conf.d snippet because this machine has a lot of fonts that claim emoji
     codepoints without being emoji fonts: Font Awesome, Garamond-Math and
     FreeSerif all won some of those characters before it was installed.
-->
<fontconfig>

  <!-- ================================================================
       The generic families.
       ================================================================ -->

  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first">
      <string>Inter</string>
      <string>Noto Sans Arabic</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend_first">
      <string>Noto Serif</string>
      <string>Noto Naskh Arabic</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- The Mono variant, not plain "Hack Nerd Font": its icon glyphs are
       squeezed to one cell, which is what a terminal grid needs. -->
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend_first">
      <string>Hack Nerd Font Mono</string>
      <string>Noto Sans Arabic</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- There is deliberately no system-ui rule. Fedora already chains it to
       sans-serif, so both halves land correctly without one (Latin on Inter,
       Arabic on Noto Sans Arabic) and a rule of ours would buy nothing while
       widening the blast radius of point 3. COSMIC sets its own interface font
       in cosmic-settings, so it does not depend on this either way. -->

  <!-- A regression matrix for these rules, and the one known exception, is in
       the "Fonts" section of CLAUDE.md. Run it after touching anything here:
       the failure mode is silent, and every bug found while writing this file
       parsed cleanly and simply resolved to the wrong font. -->

</fontconfig>
