# Keep the NVIDIA driver unloaded at boot so the discrete Quadro stays powered
# down until something actually wants it.
#
# This machine cannot power the GPU down any other way. NVIDIA runtime D3
# requires an ACPI _PR3 power resource on the PCIe root port (this Skylake
# board exposes only D0/D2/D3hot) and video-memory-off in hardware (Maxwell has
# neither), so the driver reports "Runtime D3 status: Disabled by default" and
# holds the card at D0 for as long as it is loaded -- idle or not. Unbinding is
# the only lever, and blacklisting is how the card comes up unbound.
#
# blacklist only suppresses udev's modalias-based autoload. Loading by name
# still works, so nothing is lost: a CUDA process brings the driver up through
# the setuid nvidia-modprobe helper, and prime-run loads nvidia_drm itself.
# Neither ever unloads it again -- scripts/gpu-down is what does that.
#
# It also means this file is only half a policy. It governs boot; keeping the
# card down for the rest of the session is a matter of running gpu-down when
# you are finished with it.
#
# Removing this file restores stock behaviour (driver loaded at every boot).
blacklist nvidia
blacklist nvidia_drm
blacklist nvidia_modeset
blacklist nvidia_uvm
