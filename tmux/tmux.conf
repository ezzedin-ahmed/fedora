# Gruvbox dark, flat — no powerline separators, no filled boxes.
# Palette matches alacritty/colors.toml; the styling mirrors wm/waybar/style.css:
# one colour per element, the active item just brightens.

# Alacritty exports TERM=xterm-256color, which advertises only 256 colours.
# Declare RGB support for it so the hex values below render as true colour
# instead of being quantised.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Keys ------------------------------------------------------------------------
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Seamless nvim <-> tmux pane navigation, the tmux half of
# christoomey/vim-tmux-navigator. The nvim half is nvim/lua/plugins/tmux-navigator.lua.
#
# C-h/j/k/l move between panes from anywhere (no prefix), except when the pane
# is running nvim or fzf: then the key is forwarded instead, so nvim moves
# between its own splits (LazyVim maps <C-h>/<C-l>) and fzf moves its selection.
# fzf is in the pattern because tmux-sessionizer runs it in a plain shell; without
# it, C-j/C-k in a single-pane window would be swallowed rather than reaching fzf.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\' 'select-pane -l'

# C-l no longer reaches the shell, so clear-screen moves behind the prefix.
bind C-l send-keys C-l

# Windows left/right, also prefix-free. C-M-h/C-M-l are unclaimed: sway binds no
# Ctrl combinations, fish binds neither, and tmux's only C-M defaults are
# C-M-b/C-M-f for bracket motion in copy mode.
bind -n C-M-h previous-window
bind -n C-M-l next-window

# Same movement from copy mode. Bound in both tables because mode-keys follows
# $EDITOR, which is nano here, so copy-mode-vi alone would never be consulted.
bind -T copy-mode C-h select-pane -L
bind -T copy-mode C-j select-pane -D
bind -T copy-mode C-k select-pane -U
bind -T copy-mode C-l select-pane -R
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Mouse and clipboard ---------------------------------------------------------
# Without this the mouse is not tmux's at all: drag-select, wheel-scroll and
# click-to-focus-pane all pass straight through to the application. tmux's own
# default bindings already end a drag with copy-pipe-and-cancel and already make
# double/triple click select word/line and copy, so turning the mouse on is the
# whole of "select and it is copied" -- no extra copy-mode bindings needed.
#
# Trade-off: tmux now owns the drag, so Alacritty's native selection is gone.
# Hold Shift while dragging to bypass tmux and get it back.
set -g mouse on

# Where a selection ends up. Two independent paths, the same split
# nvim/lua/config/remote_clipboard.lua makes for yanks:
#
#   copy-command  -> wl-copy, the local Wayland clipboard.
#   set-clipboard -> OSC 52 out to the terminal, which is what reaches the
#                    client machine when this server is on the far end of SSH
#                    or herdr. Alacritty accepts it via osc52 = "CopyPaste" in
#                    alacritty/alacritty.toml.
#
# set-clipboard is left at its default of "external" deliberately: that already
# emits OSC 52 for tmux's own copies while ignoring OSC 52 from applications
# inside a pane, so nvim's sequences pass through to the terminal untouched
# rather than being swallowed into a tmux buffer.
#
# On a remote server wl-copy just fails and the OSC 52 path carries the copy on
# its own, so the pair degrades cleanly rather than needing a conditional.
set -g copy-command 'wl-copy'

%hidden FG0="#fbf1c7"
%hidden FG1="#ebdbb2"
%hidden FG3="#bdae93"
%hidden FG4="#a89984"
%hidden GRAY="#928374"
%hidden BG1="#3c3836"
%hidden BG2="#504945"
%hidden RED="#fb4934"
%hidden YELLOW="#fabd2f"
%hidden AQUA="#8ec07c"

# Status bar ------------------------------------------------------------------
# bg=default lets the bar sit on Alacritty's own background, the same trick
# waybar uses to avoid drawing a panel behind itself.
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=default,fg=$FG1"

set -g status-left-length 40
set -g status-right-length 60

# Session name on the left, dimmed; prefix-pending turns it yellow, the way
# waybar colours sway's mode indicator.
set -g status-left "#[fg=#{?client_prefix,$YELLOW,$FG4}] #S #[default]"

# Clock format matches waybar's: "Tue 26 Aug  13:16".
set -g status-right "#[fg=$FG0]%a %d %b  %H:%M "

# Windows ---------------------------------------------------------------------
set -g window-status-separator ""
set -g window-status-format " #[fg=$FG3]#I #W "
# The zoom marker is a plain "Z" rather than a Nerd Font glyph: these sessions
# are also attached to over SSH/herdr, where the client font is unknown.
set -g window-status-current-format " #[fg=$FG0,bold]#I #W#[fg=$AQUA]#{?window_zoomed_flag, Z,}#[default] "
set -g window-status-activity-style "fg=$RED"
set -g window-status-bell-style "fg=$RED"

# Panes -----------------------------------------------------------------------
set -g pane-border-style "fg=$BG1"
set -g pane-active-border-style "fg=$GRAY"
set -g pane-border-lines single
set -g display-panes-colour "$FG4"
set -g display-panes-active-colour "$AQUA"

# Messages, prompts, copy mode ------------------------------------------------
set -g message-style "bg=$BG1,fg=$FG0"
set -g message-command-style "bg=$BG1,fg=$FG0"
set -g mode-style "bg=$BG2,fg=$FG0"
set -g copy-mode-match-style "bg=$BG2,fg=$YELLOW"
set -g copy-mode-current-match-style "bg=$YELLOW,fg=#282828"

# Menus and the popup border (tmux 3.2+) pick up the same two greys.
set -g menu-style "bg=default,fg=$FG1"
set -g menu-selected-style "bg=$BG2,fg=$FG0"
set -g menu-border-style "fg=$BG2"
set -g popup-style "bg=default,fg=$FG1"
set -g popup-border-style "fg=$BG2"

set -g clock-mode-colour "$AQUA"
set -g clock-mode-style 24
